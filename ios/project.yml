name: OpenProgression
options:
  bundleIdPrefix: org.openprogression
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  OpenProgression:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: Bundle data
        script: "\"$SRCROOT/scripts/copy-data.sh\""
        basedOnDependencyAnalysis: false
    sources:
      - path: OpenProgression
        excludes:
          - "Resources/data"
      - path: OpenProgression/Resources/data
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openprogression.app
        PRODUCT_NAME: OpenProgression
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenProgression
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
